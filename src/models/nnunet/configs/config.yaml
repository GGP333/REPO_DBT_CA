# configs/config.yaml
# Edit dataset_root to point to your preprocessed dataset
dataset_root: "data/preprocessed/Dataset_Both_RealWorld"

seed: 42
val_ratio: 0.2

batch_size: 1
num_workers: 0  # Reduced to avoid OOM with large datasets

max_epochs: 500
lr: 0.001
weight_decay: 0.00001
amp: true
threshold: 0.5
save_top_k: 1
loss: dice_ce

# Scheduler
scheduler: poly
warmup_epochs: 5

# Data
foreground_oversample: 0.5
augmentation: true

# Early Stopping
early_stopping: false
early_stop_patience: 50
early_stop_min_delta: 0.001

# nnU-Net auto-configuration
auto_plan: true             # Enable auto-configuration pipeline (fingerprint -> plan -> patches)
gpu_vram_gb: 16.0           # GPU VRAM budget (RTX 4070 Ti SUPER = 16GB)
patch_overlap: 0.5          # Overlap for sliding window inference (0.5 = 50%)
oversample_foreground: 0.33 # Probability of forcing foreground-centered patch
postprocess: true           # Connected-components filtering of small blobs

# Traceability
save_samples: 5
